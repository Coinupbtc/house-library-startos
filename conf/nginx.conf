# nginx sits in front of kiwix-serve. kiwix-serve answers every request with
# "Connection: close" and closes at once; through the StartOS edge that cut
# about four in ten large responses short (curl exit 18). nginx keeps the
# connection to the edge alive and reads kiwix-serve to the end.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }

http {
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  keepalive_timeout 65s;
  server_tokens off;

  server {
    listen 8080;
    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      # Stream large books and videos instead of spooling them to disk.
      proxy_max_temp_file_size 0;
      proxy_read_timeout 300s;
    }
  }
}
